interface:
  display_name: "简历工坊"
  short_description: "按岗位取舍经历，并用多种专业布局生成可信简历"
  default_prompt: "使用 $lyz-resume 从现有材料或一问一答开始，整理事实，按目标岗位选择和排序证据，再用合适的布局交付可编辑 HTML 和可投递 PDF 简历。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
  portability:
    platform_agnostic_source: true
    manual_copy_supported: true
    manual_install_targets:
      - "doubao"
      - "workbuddy"
      - "other-agent-skills-compatible"
    claim_level: "manual-copy-compatible-not-native-integration"
