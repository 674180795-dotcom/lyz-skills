interface:
  display_name: "播客成稿"
  short_description: "忠实保留访谈语气，第一轮交付一份可读的Markdown文章"
  default_prompt: "使用 $lyz-podcast-article，先读全本次转录，核对背景，写前选定真实问题与回答出处。最小编辑，保留口语与限定，禁止过度整理；使用好奇/回答且续段不重复标签。用compact_article.py临时会话检查并finish，仅交付一份Markdown，清理临时文件，不生成评分或审稿副本。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: [openai]
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
