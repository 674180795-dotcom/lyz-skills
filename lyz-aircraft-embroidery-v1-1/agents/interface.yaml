interface:
  display_name: "航空刺绣设计 1.1"
  short_description: "继承参考系列的省略、色块、视角与文字构图生成刺绣章"
  default_prompt: "使用 $lyz-aircraft-embroidery-v1-1，先对照参考系列的结构简化、线色、视角和文字，再设计同系列产品图并真实生图；不修改旧版。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: [openai]
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter; host image generation required"
