interface:
  display_name: "航空刺绣设计 1.1"
  short_description: "融合多款系列语言，换机型原创扩款并真实生图"
  default_prompt: "使用 $lyz-aircraft-embroidery-v1-1，选择其他机型，融合多款样本的设计语言，原创重组构图、背景和文字，生成同系列新款；不复刻单图。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: [openai]
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter; host image generation required"
