interface:
  display_name: "航空刺绣设计 1.1"
  short_description: "全库归纳系列语言，联动飞机、背景与字体原创生图"
  default_prompt: "使用 $lyz-aircraft-embroidery-v1-1，以用户指定J20为主体，归纳整套样本的产品语言，保原样地刺绣化简化，联动背景与字体原创设计；不复刻单图。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets: [openai]
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter; host image generation required"
