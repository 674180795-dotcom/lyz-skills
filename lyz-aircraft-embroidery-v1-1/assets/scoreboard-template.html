<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>航空刺绣 · 匿名评分</title>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--background,#f5f4f0);color:var(--foreground,#202820);font:15px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}button,select,textarea{font:inherit}button{cursor:pointer}header,main,footer{max-width:1240px;margin:auto;padding:26px 28px}header{padding-top:40px}header p{color:var(--muted-foreground,#5c665e);max-width:780px}h1{font-size:32px;line-height:1.25;letter-spacing:-.7px;margin:8px 0 14px}h2{font-size:20px;margin:0}.eyebrow{letter-spacing:.12em;font-size:12px;font-weight:700;color:#496657}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.toolbar select,.quiet{background:var(--card,#fff);border:1px solid var(--border,#d1d7d0);border-radius:8px;padding:9px 12px}.progress{margin-left:auto;font-variant-numeric:tabular-nums}main{padding-top:0;padding-bottom:120px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}.card{background:var(--card,#fff);border:1px solid var(--border,#d7dcd6);border-radius:14px;overflow:hidden}.card-head{padding:18px 22px 12px;display:flex;gap:14px;align-items:center}.code{font-weight:750;font-size:30px;line-height:1;width:42px}.task{font-size:13px;color:var(--muted-foreground,#657064)}.image-button{padding:0;margin:0;width:100%;display:block;border:0;background:white}.image-button img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.image-note{font-size:12px;color:#758071;padding:6px 22px}.ratings{padding:10px 22px 20px}.rating-row{display:grid;grid-template-columns:minmax(105px,1fr) repeat(5,38px);gap:4px;align-items:center;margin:7px 0}.dimension{font-size:14px}.rating-row label{position:relative;display:block}.rating-row input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}.rating-row span{display:block;text-align:center;line-height:32px;border:1px solid #d5dcd3;border-radius:6px;background:var(--card,#fff)}.rating-row input:checked+span{background:#1f5941;color:white;border-color:#1f5941}.rating-row input:focus-visible+span{outline:3px solid #80b69a;outline-offset:2px}textarea{resize:vertical;min-height:64px;width:100%;border:1px solid #d5dcd3;border-radius:7px;padding:8px;margin-top:12px;color:inherit;background:inherit}details{padding:0 22px 18px}summary{cursor:pointer;color:#345f4b;font-size:13px}.references{display:flex;gap:10px;padding-top:12px}.references figure{margin:0;flex:1;min-width:0}.references img{width:100%;height:180px;object-fit:contain;background:white;border:1px solid #e2e6df}.references figcaption{font-size:12px;color:#687367}.sticky{position:fixed;bottom:0;left:0;right:0;background:var(--card,#fffffff2);border-top:1px solid #d7dcd6;backdrop-filter:blur(14px);z-index:3}.sticky-inner{max-width:1240px;margin:auto;padding:14px 28px;display:flex;gap:14px;align-items:center}.primary{background:#215c43;color:#fff;border:0;border-radius:8px;padding:11px 18px;font-weight:650}.primary:disabled{background:#9daaa0;cursor:not-allowed}.save-note{margin-left:auto;font-size:12px;color:#64705f}.legend{font-size:13px;color:#626f62}.hidden{display:none}dialog{max-width:min(1100px,96vw);max-height:94vh;padding:12px;border:0;border-radius:12px;background:white;color:#17221b}dialog::backdrop{background:#000a}dialog img{width:100%;max-height:80vh;object-fit:contain;display:block}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.close{border:0;background:#eef1eb;border-radius:6px;padding:6px 12px}.rubric{margin:16px 0 22px;padding:14px 18px;border-left:3px solid #93aa98;background:var(--card,#fff)}.rubric p{margin:2px 0;font-size:13px}.qa-banner{padding:8px;background:#fff0c4}a{color:#345f4b}@media(max-width:720px){header,main{padding-left:14px;padding-right:14px}.grid{grid-template-columns:1fr;gap:20px}h1{font-size:27px}.ratings{padding:10px 16px 18px}.rating-row{grid-template-columns:minmax(100px,1fr) repeat(5,minmax(28px,38px))}.sticky-inner{padding:12px 14px;flex-wrap:wrap;gap:8px}.save-note{width:100%;margin:0}.progress{margin-left:0}.references img{height:150px}}
</style>
</head>
<body>
<header>
<div class="eyebrow">SIX IMAGES · BLIND REVIEW</div>
<h1>航空刺绣，匿名看图评分</h1>
<p>六张图来自两套流程、三道相同题目。这里只显示匿名编号，不显示版本归属、执行提示或作者评价。请对照本题参考，按你的审美评分。</p>
<div class="rubric"><p><b>1分</b> 明显不符　<b>3分</b> 基本可接受　<b>5分</b> 与参考同系列且表现出色。</p><p>结构看机型大形；省略看保留与删减；配色看色块与主次；视角看投影与姿态；文本看准确性与构图；同系列感看能否放进原图集中。</p></div>
<div class="toolbar"><label for="task-filter">查看</label><select id="task-filter"><option value="all">全部六张</option></select><span class="legend">点击图片放大；每项均未预选。</span><strong id="progress" class="progress" aria-live="polite">0 / 36 项</strong></div>
</header>
<main><div id="cards" class="grid"></div><p class="legend">评分只保存在本机浏览器。完成后导出JSON发回本次聊天，再揭盲比较；页面不会自行上传或宣布哪个版本获胜。</p></main>
<div class="sticky"><div class="sticky-inner"><button id="export-complete" class="primary" disabled>完成评分后导出</button><button id="export-draft" class="quiet">导出当前草稿</button><span id="save-note" class="save-note">还没有评分</span></div></div>
<dialog id="zoom"><div class="modal-head"><strong id="zoom-title"></strong><button id="close-zoom" class="close">关闭</button></div><img id="zoom-image" alt="放大的匿名候选图"></dialog>
<script id="public-data" type="application/json">__PUBLIC_DATA__</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById("public-data").textContent);
const dimensions=[['structure','型号结构'],['omission','简化取舍'],['color','配色组织'],['angle','视角姿态'],['text','文字设计'],['series','同系列感']];
const qa=new URLSearchParams(location.search).get('qa');
const storageKey='embroidery-blind:'+data.session+(qa?':qa:'+qa:'');
const empty=()=>Object.fromEntries(data.items.map(x=>[x.label,Object.assign(Object.fromEntries(dimensions.map(d=>[d[0],null])),{comment:''})]));
let ratings=empty();
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved&&saved.session===data.session&&saved.assignment_commitment_sha256===data.assignment_commitment_sha256){for(const item of data.items){for(const [key] of dimensions){const v=saved.ratings?.[item.label]?.[key];if(Number.isInteger(v)&&v>=1&&v<=5)ratings[item.label][key]=v;}ratings[item.label].comment=typeof saved.ratings?.[item.label]?.comment==='string'?saved.ratings[item.label].comment:'';}}}catch(e){}
if(qa){const n=document.createElement('div');n.className='qa-banner';n.textContent='界面测试模式：与真实评分分开保存';document.body.prepend(n);}
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function payload(){return{session:data.session,assignment_commitment_sha256:data.assignment_commitment_sha256,ratings,exported_at:new Date().toISOString(),qa:!!qa};}
function update(save=true){const n=data.items.reduce((sum,item)=>sum+dimensions.filter(([d])=>Number.isInteger(ratings[item.label][d])).length,0);document.getElementById('progress').textContent=n+' / 36 项';const b=document.getElementById('export-complete');b.disabled=n!==36;b.textContent=n===36?'导出完整评分':'完成评分后导出';if(save){try{localStorage.setItem(storageKey,JSON.stringify(payload()));document.getElementById('save-note').textContent='已保存在本机 · '+new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai'});}catch(e){document.getElementById('save-note').textContent='浏览器不支持自动保存，请导出草稿';}}}
const cards=document.getElementById('cards');
for(const item of data.items){const task=data.cases.find(x=>x.id===item.task_id);const article=document.createElement('article');article.className='card';article.dataset.task=item.task_id;article.dataset.label=item.label;
article.innerHTML='<div class="card-head"><div class="code">'+escapeHTML(item.label)+'</div><div><h2>候选 '+escapeHTML(item.label)+'</h2><div class="task">'+escapeHTML(task.title)+' · 文字 '+escapeHTML(task.label)+'</div></div></div><button class="image-button" aria-label="放大候选'+item.label+'"><img src="'+escapeHTML(item.image)+'" alt="匿名候选'+item.label+'" loading="eager"></button><div class="image-note">各图统一显示尺寸，未作质量筛选。</div><div class="ratings">'+dimensions.map(([key,name])=>'<div class="rating-row"><div class="dimension">'+name+'</div>'+[1,2,3,4,5].map(v=>'<label title="'+name+' '+v+'分"><input type="radio" name="'+item.label+'.'+key+'" value="'+v+'" aria-label="候选'+item.label+' '+name+' '+v+'分" '+(ratings[item.label][key]===v?'checked':'')+'><span>'+v+'</span></label>').join('')+'</div>').join('')+'<textarea placeholder="可选：哪一处好或不好" aria-label="候选'+item.label+'评语"></textarea></div><details><summary>查看本题两张参考</summary><div class="references">'+task.references.map(r=>'<figure><img src="'+escapeHTML(r.image)+'" alt="参考'+r.id+'" loading="lazy"><figcaption>参考 '+escapeHTML(r.id)+'</figcaption></figure>').join('')+'</div></details>';
article.querySelector('textarea').value=ratings[item.label].comment;
article.querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>{ratings[item.label][input.name.split('.')[1]]=Number(input.value);update();}));
article.querySelector('textarea').addEventListener('input',e=>{ratings[item.label].comment=e.target.value;update();});
article.querySelector('.image-button').addEventListener('click',()=>{document.getElementById('zoom-title').textContent='候选 '+item.label;document.getElementById('zoom-image').src=item.image;document.getElementById('zoom').showModal();});
cards.append(article);}
const filter=document.getElementById('task-filter');for(const task of data.cases){const o=document.createElement('option');o.value=task.id;o.textContent=task.title;filter.append(o);}filter.addEventListener('change',()=>document.querySelectorAll('.card').forEach(card=>card.hidden=filter.value!=='all'&&card.dataset.task!==filter.value));
document.getElementById('close-zoom').addEventListener('click',()=>document.getElementById('zoom').close());
function download(complete){const count=data.items.reduce((n,item)=>n+dimensions.filter(([d])=>Number.isInteger(ratings[item.label][d])).length,0);if(complete&&count!==36)return;const blob=new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='评分-'+data.session+(complete?'':'-草稿')+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
document.getElementById('export-complete').addEventListener('click',()=>download(true));document.getElementById('export-draft').addEventListener('click',()=>download(false));update(false);
</script>
</body></html>
