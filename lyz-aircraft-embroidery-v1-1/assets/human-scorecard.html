<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>技能迭代 · 人工评分</title>
<style>
:root{color-scheme:light;--ink:#17272c;--muted:#52666b;--line:#cfdcda;--accent:#006b5d;--paper:#fff;--bg:#f4f6f3}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"PingFang SC",sans-serif}
main{height:100dvh;max-width:1400px;margin:auto;padding:18px 24px 0;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:12px}
h1{font-size:23px;line-height:1.25;margin:0}h2,h3,p{margin:0}.muted,small{color:var(--muted)}
header{display:flex;align-items:center;justify-content:space-between;gap:20px}.intro{margin-top:5px;color:var(--muted);font-size:13px;max-width:900px}
#session{font-size:11px;white-space:nowrap;color:var(--muted)}
.toolbar{display:flex;align-items:center;gap:10px;min-width:0}
#task-title{font-size:16px;margin-right:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav{display:flex;gap:5px}.nav-item{min-width:34px;padding:6px 9px}.nav-item[aria-current=true]{background:var(--accent);color:white}
button,a{touch-action:manipulation}button{border:1px solid var(--line);border-radius:7px;padding:8px 13px;font:inherit;background:white;color:var(--ink);cursor:pointer}
button:disabled{opacity:.4;cursor:default}.primary{background:var(--accent);border-color:var(--accent);color:white}
button:focus-visible,a:focus-visible,input:focus-visible+span,textarea:focus-visible{outline:3px solid #d58d25;outline-offset:2px}
#cases{min-height:0}article{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(350px,440px);gap:24px}
.material-panel{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:10px}
.main-material{min-height:0;display:flex;align-items:center;justify-content:center;background:white;border:1px solid var(--line);border-radius:10px;overflow:auto}
.image-trigger{border:0;background:none;display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-height:0;padding:12px}
.review-image{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.image-trigger .review-image{width:min(100%,440px);height:min(100%,440px)}
.material{white-space:pre-wrap;overflow-wrap:anywhere;padding:20px;align-self:flex-start}.links{display:flex;gap:12px;flex-wrap:wrap}a{color:var(--accent)}
.reference-strip{display:flex;align-items:center;gap:8px;min-height:64px;overflow-x:auto}.reference-label{font-size:12px;color:var(--muted);flex-shrink:0}
.reference-trigger{padding:3px;border-radius:6px;width:65px;height:65px;flex-shrink:0}.reference-trigger .review-image{width:100%;height:100%}
.image-hint{font-size:11px;color:var(--muted);margin-left:auto}
.scores{min-height:0;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.scores h3{font-size:17px}.variant-caption{font-size:12px;color:var(--muted);margin:3px 0 4px}
fieldset{border:0;border-top:1px solid var(--line);margin:9px 0 0;padding:8px 0 0;min-width:0}
legend{font-weight:650;padding:0 8px 0 0;font-size:14px}.badge{font-size:11px;color:var(--accent);font-weight:400;margin-left:8px}
.standard{float:right;padding:0 4px;border:0;color:var(--muted);font-size:12px;background:transparent}
.target{font-size:12px;line-height:1.35;color:var(--muted)}
body[data-rubric="r5"] .target{display:none}
.choices{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:6px}
.choice{position:relative;text-align:center}.choice input{position:absolute;opacity:0;width:1px;height:1px}
.choice span{display:flex;min-height:34px;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;cursor:pointer;font-weight:650}
.choice input:checked+span{background:var(--accent);border-color:var(--accent);color:white}
footer{min-height:56px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:9px 0}
#progress{font-size:13px;margin-right:auto}#notice{color:var(--accent);font-size:12px;max-width:240px}
dialog{border:1px solid var(--line);border-radius:12px;padding:24px;max-width:min(92vw,680px);max-height:90dvh;overflow:auto;color:var(--ink)}
dialog::backdrop{background:#132c35a8}dialog h2{font-size:20px;margin:0 38px 14px 0}dialog p{margin:12px 0}
.dialog-close{position:absolute;right:12px;top:12px;padding:4px 10px}
#media-dialog{max-width:96vw;padding:32px 12px 12px}
#media-dialog img{display:block;max-width:90vw;max-height:82dvh;object-fit:contain}
textarea{display:block;width:100%;min-height:90px;border:1px solid var(--line);border-radius:7px;padding:12px;font:inherit;color:var(--ink)}
#copy-output{min-height:190px;font:13px/1.5 ui-monospace,monospace}#fallback{margin-top:16px}#error{color:#9a2517}
@media(max-height:700px){main{padding-top:10px;gap:8px}.intro{display:none}.target{display:none}fieldset{margin-top:7px;padding-top:6px}.choices{margin-top:4px}.reference-strip{min-height:50px}.reference-trigger{width:50px;height:50px}}
@media(max-width:760px){main{padding:12px 12px 0;gap:8px}header{gap:8px}h1{font-size:18px}.intro,#session{display:none}.toolbar{gap:6px;flex-wrap:wrap}#task-title{font-size:13px;flex-basis:100%}.nav-item{min-width:30px;padding:4px 7px}article{grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:10px}.scores{padding:9px}.scores h3{font-size:14px}.variant-caption,.target,.image-hint{display:none}legend{font-size:12px}.badge{margin-left:4px;font-size:10px}.standard{font-size:10px}.choices{gap:3px}.choice span{min-height:32px;font-size:12px}fieldset{margin-top:9px;padding-top:7px}.reference-strip{gap:4px;flex-wrap:wrap;overflow:hidden}.reference-label{width:100%}.reference-trigger{width:48px;height:48px}.image-trigger{padding:4px}footer{gap:6px;flex-wrap:wrap;min-height:56px}footer button{padding:7px 9px;font-size:12px}#notice{flex-basis:100%;order:2;max-width:none}#notice:empty{display:none}#progress{font-size:11px}}
</style>
<main>
  <header><div><h1 id="title">正在载入评分内容</h1><p id="intro" class="intro"></p></div><p id="session"></p></header>
  <div class="toolbar"><h2 id="task-title"></h2><nav id="navigation" aria-label="切换待审成果"></nav><button id="task-info" type="button">任务与量表</button></div>
  <div id="cases"><p id="error" role="alert"></p></div>
  <footer><p id="progress" aria-live="polite">尚未评分</p><p id="notice" role="status" aria-live="polite"></p><button id="previous" type="button">上一张</button><button id="next" type="button">下一张</button><button id="feedback" type="button">反馈</button><button id="copy" class="primary" type="button">复制分数</button></footer>
</main>
<dialog id="info-dialog"><button class="dialog-close" type="button" aria-label="关闭">×</button><h2>任务与量表</h2><p id="task-prompt"></p><p>1 无法使用 · 2 需大改 · 3 可用但要改 · 4 小改即可 · 5 可直接采用 · N 无法判断。没有预填分数。</p><div id="info-standards"></div></dialog>
<dialog id="standard-dialog"><button class="dialog-close" type="button" aria-label="关闭">×</button><h2 id="standard-title"></h2><p id="standard-target"></p><div id="standard-anchors"></div></dialog>
<dialog id="media-dialog"><button class="dialog-close" type="button" aria-label="关闭">×</button><img id="large-image" alt="放大查看"></dialog>
<dialog id="feedback-dialog"><button class="dialog-close" type="button" aria-label="关闭">×</button><h2>你的反馈</h2><label for="note">最想改的一点（选填）</label><textarea id="note" placeholder="可以留空，分数本身就是有效反馈。"></textarea><p>点选完成后复制分数，粘贴回聊天即可。含 N 保持待补评。</p><div id="fallback" hidden><label for="copy-output">复制受限，请在下框按 Cmd/Ctrl+C。</label><textarea id="copy-output" readonly></textarea></div></dialog>
<!-- Public review data only. No version mappings, private prompts or author scores. -->
<script type="application/json" id="review-data">
{
  "session_id": "example-review-001",
  "rubric_version": "r1",
  "title": "本轮技能成果，是否更好用？",
  "intro": "这是模板示例，不是实际执行证据。使用时请换成真实任务、成果和有针对性的标准。",
  "criteria": [
    {"id":"goal","label":"有效","weight":3,"critical":true,"target":"成果是否完成这道任务的必要要求。","anchors":{"1":"主要要求未完成。","3":"主要要求完成，但仍有明显缺口。","5":"必要要求齐全，可以直接采用。"}},
    {"id":"quality","label":"核心质量（请换成任务标准）","weight":3,"critical":true,"target":"替换为本轮最需要改善的具体能力。","anchors":{"1":"关键缺陷仍使成果不可用。","3":"有所改善，仍需明显调整。","5":"关键缺陷已解决，细节也可靠。"}},
    {"id":"clarity","label":"易懂","weight":1,"critical":false,"target":"是否能理解成果和下一步操作。","anchors":{"1":"不知道结果是什么意思或怎么用。","3":"能理解，但要反复读或追问。","5":"一遍看懂，下一步清楚。"}}
  ],
  "cases": [{"id":"task1","title":"替换为实际任务","prompt":"在此放相同任务的要求。","variants":[{"id":"A","content":"在此放实际成果，或给出可打开的材料链接。","links":[]}]}]
}
</script>
<script>
"use strict";
(() => {
  const byId = id => document.getElementById(id);
  const el = (tag, text, className) => {
    const n = document.createElement(tag);
    if (text !== undefined) n.textContent = text;
    if (className) n.className = className;
    return n;
  };
  const safeId = value => typeof value === "string" && /^[A-Za-z0-9_-]{1,80}$/.test(value);
  const safeUrl = src => {
    const url = new URL(src, location.href);
    if (!["http:","https:","file:"].includes(url.protocol)) throw Error("不支持的材料链接");
    return url.href;
  };
  let data;
  try {
    data = JSON.parse(byId("review-data").textContent);
    if (!safeId(data.session_id) || !safeId(data.rubric_version)) throw Error("会话编号或标准版本无效");
    if (!Array.isArray(data.criteria) || data.criteria.length < 3 || data.criteria.length > 5) throw Error("评分维度须为 3–5 项");
    if (new Set(data.criteria.map(c => c.id)).size !== data.criteria.length) throw Error("维度编号重复");
    for (const c of data.criteria) {
      if (!safeId(c.id) || !c.label || !c.target || ![1,2,3].includes(c.weight) || typeof c.critical !== "boolean" || ![1,3,5].every(n => c.anchors?.[n])) throw Error("标准须有观察说明、重要性和1/3/5分锚点");
    }
    if (!data.criteria.some(c => c.critical)) throw Error("至少指定一个核心项");
    if (!Array.isArray(data.cases) || !data.cases.length || new Set(data.cases.map(c=>c.id)).size !== data.cases.length) throw Error("任务不能为空或重复");
    for (const task of data.cases) {
      if (!safeId(task.id) || !task.title || !task.prompt || !Array.isArray(task.variants) || !task.variants.length || new Set(task.variants.map(v=>v.id)).size !== task.variants.length) throw Error("任务或候选信息不完整");
      for (const v of task.variants) {
        if (!safeId(v.id) || (!v.image && !v.content && !v.links?.length)) throw Error("候选缺少成果材料");
        if (v.image) safeUrl(v.image);
      }
      for (const ref of task.references || []) safeUrl(ref.image);
    }
  } catch(e) {
    byId("error").textContent = "评分内容有误，请让作者修正：" + e.message;
    byId("copy").disabled = true;
    return;
  }
  document.body.dataset.rubric = data.rubric_version;
  document.title = data.title;
  byId("title").textContent = data.title;
  byId("intro").textContent = data.intro;
  byId("session").textContent = data.session_id + " / " + data.rubric_version;
  const groups = [], panels = [], navigation = [];
  let current = 0;
  const show = index => {
    current = Math.max(0,Math.min(index,panels.length-1));
    panels.forEach((item,i) => item.article.hidden = i !== current);
    navigation.forEach((button,i) => button.setAttribute("aria-current",String(i===current)));
    byId("task-title").textContent = panels[current].task.title + " · 成果 " + panels[current].variant.id;
    byId("task-prompt").textContent = panels[current].task.prompt;
    byId("previous").disabled = current === 0;
    byId("next").disabled = current === panels.length-1;
  };
  const imageButton = (src, alt, className) => {
    const button = el("button", undefined, className);
    button.type = "button"; button.setAttribute("aria-label","放大 " + alt);
    const image = el("img"); image.src = safeUrl(src); image.alt = alt; image.className = "review-image";
    button.append(image);
    button.addEventListener("click",()=>{byId("large-image").src=image.src;byId("large-image").alt=alt;byId("media-dialog").showModal();});
    return button;
  };
  for (const task of data.cases) for (const variant of task.variants) {
    const index=panels.length, article=el("article");
    article.hidden=true;
    const materials=el("div",undefined,"material-panel"), main=el("div",undefined,"main-material");
    if (variant.image) main.append(imageButton(variant.image,"成果 "+variant.id,"image-trigger"));
    else {
      const text=el("div",variant.content||"","material");
      const links=el("p",undefined,"links");
      for (const link of variant.links || []) {
        try {const a=el("a",link.label||"打开成果");a.href=safeUrl(link.href);a.target="_blank";a.rel="noopener noreferrer";links.append(a);}
        catch {links.append(el("span","材料链接无效，请联系作者补充。"));}
      }
      text.append(links);main.append(text);
    }
    const refs=el("div",undefined,"reference-strip");refs.append(el("span","参考","reference-label"));
    for (const ref of task.references || []) refs.append(imageButton(ref.image,ref.id,"reference-trigger"));
    refs.append(el("span","点图可放大","image-hint"));if(!task.references?.length)refs.hidden=true;
    materials.append(main,refs);
    const scores=el("div",undefined,"scores");scores.append(el("h3","成果 "+variant.id),el("p",variant.content||"","variant-caption"));
    for (const c of data.criteria) {
      const group=task.id+"__"+variant.id+"__"+c.id;
      groups.push({group,task:task.id,variant:variant.id,criterion:c.id,panel:index});
      const field=el("fieldset"),legend=el("legend",c.label);
      legend.append(el("span",c.critical?"核心":"一般","badge"));
      const standard=el("button","标准","standard");standard.type="button";standard.setAttribute("aria-label",c.label+"评分标准");
      standard.addEventListener("click",()=>{
        byId("standard-title").textContent=c.label;byId("standard-target").textContent=c.target;
        byId("standard-anchors").replaceChildren(...[1,3,5].map(n=>el("p",n+"分："+c.anchors[n])));
        byId("standard-dialog").showModal();
      });
      field.append(legend,standard,el("div",c.target,"target"));
      const choices=el("div",undefined,"choices");
      for (const value of ["1","2","3","4","5","N"]) {
        const label=el("label",undefined,"choice"),radio=el("input");
        radio.type="radio";radio.name=group;radio.value=value;
        radio.setAttribute("aria-label",c.label+" "+(value==="N"?"无法判断":value+"分"));
        label.append(radio,el("span",value));choices.append(label);
      }
      field.append(choices);scores.append(field);
    }
    article.append(materials,scores);byId("cases").append(article);
    panels.push({article,task,variant});
    const button=el("button",variant.id,"nav-item");button.type="button";button.setAttribute("aria-label",task.title+" 成果 "+variant.id);
    button.addEventListener("click",()=>show(index));byId("navigation").append(button);navigation.push(button);
  }
  for (const c of data.criteria) {
    const p=el("p");p.append(el("strong",c.label+"（"+(c.critical?"核心":"一般")+"）"),el("br"),document.createTextNode(c.target));
    byId("info-standards").append(p);
  }
  const storageKey="human-review:"+JSON.stringify(data);
  const scoreFor=group=>[...document.getElementsByName(group)].find(n=>n.checked)?.value;
  const refresh=()=>{
    const scores=Object.fromEntries(groups.map(g=>[g.group,scoreFor(g.group)]).filter(([,v])=>v));
    byId("progress").textContent="已填 "+Object.keys(scores).length+" / "+groups.length;
    try{localStorage.setItem(storageKey,JSON.stringify({scores,note:byId("note").value}));}catch{}
    byId("fallback").hidden=true;byId("notice").textContent="";
  };
  try {
    const saved=JSON.parse(localStorage.getItem(storageKey)||"null");
    if(saved?.scores)for(const g of groups)for(const n of document.getElementsByName(g.group))n.checked=n.value===saved.scores[g.group];
    if(typeof saved?.note==="string")byId("note").value=saved.note;
  }catch{}
  byId("cases").addEventListener("change",refresh);byId("note").addEventListener("input",refresh);
  byId("previous").addEventListener("click",()=>show(current-1));byId("next").addEventListener("click",()=>show(current+1));
  byId("task-info").addEventListener("click",()=>byId("info-dialog").showModal());
  byId("feedback").addEventListener("click",()=>byId("feedback-dialog").showModal());
  for(const button of document.querySelectorAll(".dialog-close"))button.addEventListener("click",()=>button.closest("dialog").close());
  byId("copy").addEventListener("click",async()=>{
    const missing=groups.filter(g=>!scoreFor(g.group));
    if(missing.length){show(missing[0].panel);byId("notice").textContent="还有 "+missing.length+" 项未填；可选 N。";document.getElementsByName(missing[0].group)[0].focus();return;}
    const lines=["评分 "+data.session_id+" / "+data.rubric_version,"顺序："+data.criteria.map(c=>c.label).join(" | ")];
    for(const task of data.cases)for(const v of task.variants)lines.push((data.rubric_version==="r5"?"":task.id+"/")+v.id+"："+data.criteria.map(c=>scoreFor(task.id+"__"+v.id+"__"+c.id)).join(" "));
    if(groups.some(g=>scoreFor(g.group)==="N"))lines.push("状态：含 N，待补评");
    if(byId("note").value.trim())lines.push("最要改："+byId("note").value.trim());
    const output=lines.join("\n");byId("copy-output").value=output;
    try{await navigator.clipboard.writeText(output);byId("notice").textContent="已复制，粘贴回聊天即可。";}
    catch{byId("fallback").hidden=false;if(!byId("feedback-dialog").open)byId("feedback-dialog").showModal();byId("copy-output").focus();byId("copy-output").select();byId("notice").textContent="请复制弹窗中的分数。";}
  });
  show(0);refresh();
})();
</script>
</html>
